name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mi-temp-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, mi-temp]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t "mi-temp:${GITHUB_SHA}" .
      - name: Test
        run: docker run --rm --network none --mount "type=bind,src=${GITHUB_WORKSPACE}/tests,dst=/app/tests,readonly" "mi-temp:${GITHUB_SHA}" python -m unittest discover -s tests
      - name: Deploy
        env:
          MI_IMAGE: mi-temp:${{ github.sha }}
        run: bash deploy/deploy.sh
